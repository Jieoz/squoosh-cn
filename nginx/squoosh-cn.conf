# ========== squoosh-cn 图片压缩 ==========
    # 官方产物靠 Netlify 的 _headers 文件下发 COOP/COEP，nginx 不读该文件。
    # 缺了 cross-origin isolation 就没有 SharedArrayBuffer，AVIF / JPEG XL /
    # WebP v2 的多线程 WASM 编码器会退化甚至失败。这里显式补齐。
    #
    # 注意：location 里出现任何 add_header 都会丢掉 server 级继承的头，
    # 所以 snippet 里连 HSTS 一起重发。
    #
    # 部署到别的路径时，把下面所有 /squoosh-cn/ 换成你的路径；
    # include 用绝对路径（nginx 的相对 include 依赖编译期 prefix，不可靠）。
    location ^~ /squoosh-cn/ {
        include /etc/nginx/snippets/squoosh-cn-headers.conf;
        add_header Cache-Control "no-cache" always;

        # 内容哈希命名的静态资源可以长缓存
        location ~ ^/squoosh-cn/c/ {
            include /etc/nginx/snippets/squoosh-cn-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        # service worker 必须每次回源，否则改了页面老用户看不到
        location ~ ^/squoosh-cn/(serviceworker|sw|sw-bridge\.[0-9a-f]+)\.js$ {
            include /etc/nginx/snippets/squoosh-cn-headers.conf;
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed "/squoosh-cn/" always;
        }
    }
    # ========== squoosh-cn 配置结束 ==========
